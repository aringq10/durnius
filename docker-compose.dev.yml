name: durnius

# Development stack: Vite dev server with HMR (port 5173) alongside the API
# running under `dotnet watch` hot reload (port 8080) and postgres. Start it with:
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Source is bind-mounted, including the host installs: node_modules live in
# src/Durnius.Client/node_modules and the .NET build output in
# src/Durnius.Web/{obj,bin}.

services:
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: client
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      VITE_API_URL: http://localhost:${PORT:?}
    volumes:
      - ./src/Durnius.Client:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: backend
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:?};Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?}
      Jwt__Key: ${JWT_KEY:?}
      Jwt__Issuer: ${JWT_ISSUER:?}
      Jwt__Audience: ${JWT_AUDIENCE:?}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:?}
    volumes:
      - ./src/Durnius.Web:/src/src/Durnius.Web
    ports:
      - "${PORT:?}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
