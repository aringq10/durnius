name: durnius

# Production stack: a single backend container serves both the /api endpoints
# and the built React SPA from its wwwroot. Start it with:
#
#   docker compose up --build
#
# For hot-reload development use in conjunction with docker-compose.dev.yml.

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:?};Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?}
      Jwt__Key: ${JWT_KEY:?}
      Jwt__Issuer: ${JWT_ISSUER:?}
      Jwt__Audience: ${JWT_AUDIENCE:?}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:?}
    ports:
      - "${PORT:?}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
